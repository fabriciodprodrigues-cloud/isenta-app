# Proxy reverso HTTPS para o email-service, em /etc/nginx/sites-enabled/isenta-email-service
# no VPS (srv1920691.hstgr.cloud, 187.127.62.116).
#
# O Node escuta só em 127.0.0.1 (ver src/index.ts) — quem expõe a porta 443
# ao mundo, com certificado, é este bloco. Certificado emitido via
# `certbot certonly --standalone` (não o plugin --nginx: havia outro bloco
# capturando o desafio HTTP-01 e derrubando a verificação).

server {
    listen 80;
    listen [::]:80;
    server_name srv1920691.hstgr.cloud;

    # Redireciona tudo para HTTPS — a credencial da caixa do órgão nunca
    # deve trafegar sem TLS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name srv1920691.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/srv1920691.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1920691.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

version: '3.8'

services:
  # PostgreSQL Database (opcional, para produção)
  postgres:
    image: postgres:16-alpine
    container_name: isenta_postgres
    environment:
      POSTGRES_USER: isenta
      POSTGRES_PASSWORD: isenta_dev_password
      POSTGRES_DB: isenta_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - isenta_network

  # Redis for Queue
  redis:
    image: redis:7-alpine
    container_name: isenta_redis
    ports:
      - "6379:6379"
    networks:
      - isenta_network

  # Web Application
  web:
    build: .
    container_name: isenta_web
    environment:
      DATABASE_URL: "postgresql://isenta:isenta_dev_password@postgres:5432/isenta_db"
      REDIS_URL: "redis://redis:6379"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "your-secret-key-here-change-in-production"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - isenta_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  isenta_network:
    driver: bridge
